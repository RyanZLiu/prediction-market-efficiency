[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prediction-market-efficiency"
version = "0.1.0"
description = "Quantitative research system for prediction-market price discovery, consistency, and cross-venue inefficiencies."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Research Project"}]
dependencies = [
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
  "duckdb>=1.3.0",
  "polars>=1.25.0",
  "pyarrow>=18.0.0",
  "numpy>=2.0.0",
  "scipy>=1.14.0",
  "statsmodels>=0.14.0",
  "cvxpy>=1.6.0",
  "rapidfuzz>=3.10.0",
  "python-dotenv>=1.0.1",
  "typer>=0.16.0",
  "rich>=14.0.0",
  "streamlit>=1.45.0",
  "plotly>=6.0.0",
  "websockets>=15.0",
  "cryptography>=44.0.0",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.11.0"]

[project.scripts]
pme = "pme.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pme"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"dashboard/app.py" = ["E402"]
"src/pme/cli.py" = ["B008"]
